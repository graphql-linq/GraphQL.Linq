name: Build artifacts

# ==== NOTE: do not rename this yml file or the run_number will be reset ====

on:
  push:
    branches:
      - master
      - develop

jobs:
  build:
#    runs-on: windows-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use .NET Core SDKs
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/graphql-linq/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Install dependencies
        run: dotnet restore
      - name: Build solution [Release]
        run: dotnet build --no-restore -c Release -p:VersionSuffix=$GITHUB_RUN_NUMBER
      - name: Pack solution [Release]
        run: dotnet pack --no-restore --no-build -c Release -p:VersionSuffix=$GITHUB_RUN_NUMBER -o out
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nuget packages
          path: out/*
      - name: Publish Nuget packages to GitHub registry
        run: dotnet nuget push "out/*" -k ${{secrets.GITHUB_TOKEN}}

  test-coverage:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use .NET Core SDKs
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install dependencies
        run: dotnet restore
      - name: Build solution [Debug]
        run: dotnet build --no-restore
      - name: Test solution [Debug]
        run: dotnet test --no-restore --no-build -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Convert coverage report to cobertura format with filters
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.17
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: '.'
          reporttypes: 'Cobertura'
          tag: 'build_${{ github.run_number }}'
          assemblyfilters: +GraphQL*
      - name: Submit coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Cobertura.xml
          format: cobertura
          base-path: .
